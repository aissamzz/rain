server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- compression ----
    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css application/javascript
                    application/manifest+json image/svg+xml font/woff2;

    # ---- correct MIME type for the web manifest ----
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # ---- the service worker must never be cached hard, or updates stall ----
    location = /sw.js {
        types { } default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # ---- HTML: always revalidate ----
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
    }

    # ---- long-lived static media (safe to cache aggressively) ----
    location ~* \.(?:woff2|jpg|jpeg|png|svg|ico|mp3)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---- everything else ----
    location / {
        try_files $uri $uri/ =404;
    }
}
